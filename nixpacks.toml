[phases.setup]
nixPkgs = ["python311", "gcc", "gcc-unwrapped"]

[phases.install]
cmds = [
    "python3.11 -m pip install --upgrade pip setuptools wheel",
    "python3.11 -m pip install -r requirements.txt"
]

[start]
cmd = "python3.11 -m gunicorn app:app --bind 0.0.0.0:$PORT --timeout 300 --workers 1"
